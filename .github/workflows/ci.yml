name: Build and unit tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: termux
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install the NDK pinned in gradle.properties
        run: |
          ndk=$(sed -n 's/^ndkVersion=//p' gradle.properties)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null

      - name: Build and run unit tests
        run: ./gradlew assembleDebug :app:testDebugUnitTest --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: termux/app/build/reports/tests/
          retention-days: 7

      - name: Upload arm64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-linux-debug-arm64
          path: termux/app/build/outputs/apk/debug/*arm64-v8a.apk
          retention-days: 7
