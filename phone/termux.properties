# 画面下のキー列(PC のキーボードに近い操作用)
extra-keys = [ \
 ['ESC', '/', '-', '|', '~', 'HOME', 'UP', 'END', 'PGUP'], \
 ['TAB', 'CTRL', 'ALT', ':', {key: 'DEL', display: 'DEL'}, 'LEFT', 'DOWN', 'RIGHT', 'PGDN'] \
]
# true にすると入力欄が英字専用になり、日本語に切り替えられなくなる
enforce-char-based-input = false
# 空行での Backspace などで鳴るベルを振動させない
bell-character = ignore
